name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run check:brand
      - run: npm test

  # Everything that needs data: migrations, RLS, repositories, then the production build
  # and e2e against a throwaway local Supabase stack with the fake seed data (doc 09).
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Postgres, PostgREST, Kong and Auth (needed for `status` to print the keys).
      # Applies the migrations and seed.sql.
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db lint --level warning --fail-on warning
      - run: supabase test db
      - name: Generated types are up to date (run `npm run db:types`)
        run: |
          supabase gen types typescript --local \
            | npx prettier --stdin-filepath src/lib/supabase/database.types.ts \
            | diff - src/lib/supabase/database.types.ts
      - name: Repository integration tests
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            | grep '^NEXT_PUBLIC_SUPABASE_' > .env.local
          npm run test:integration
      # Pages read Supabase at build time, so the build and e2e run here.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
